\usepackage[backend=biber,style=ieee,sorting=ymdnt,defernumbers=true]{biblatex} %% Set 'dashed=true' to show repeated authors with ----
%% Declare bibliography sorting scheme
\DeclareSortingTemplate{ymdnt}{%
	\sort{\field{presort}}%
	\sort[direction=descending]{\field{year}}%
	\sort[direction=descending]{\field{month}}%
	\sort{%
		\field{author}%
		\field{editor}%
		\field{translator}%
	}%
	\sort{\field{title}}%
	\sort{\field{entrytype}}%
}
%% For removing numbering entirely when using a numeric style
\setlength{\bibhang}{1.25em}
\DeclareFieldFormat{labelnumberwidth}{\makebox[\bibhang][l]{\itemmarker}}
\setlength{\biblabelsep}{0pt}
%% Keep each heading on the same page as its first entry
\usepackage{needspace}
\defbibheading{pubtype}{\needspace{4\baselineskip}\cvsubsection{#1}}
\renewcommand{\bibsetup}{\vspace*{-\baselineskip}}
\AtEveryBibitem{%
  \iffieldundef{doi}{}{\clearfield{url}}%
}
